[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "skyq-voice-control"
version = "1.0.0"
description = "Google Home voice control for Sky Q boxes via pyskyq"
requires-python = ">=3.11"
dependencies = [
    "pyskyq>=0.6.1",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
